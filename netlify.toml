# Netlify builds the site. If CONVEX_DEPLOY_KEY is set in Netlify, the build
# also pushes the Convex functions first, so the site and the database can
# never be out of step:
#   key starting with "dev:"  -> pushed to that dev deployment
#   any other key (prod)      -> npx convex deploy
# With no key, only the site is built and the backend must be pushed by hand
# with `npx convex dev`.
[build]
  command = "sh scripts/netlify-build.sh"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
